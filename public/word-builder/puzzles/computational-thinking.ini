PROBLEM.question=What is a problem in the context of engineering or computing?
PROBLEM.answer=A problem is a need or challenge that must be understood and solved.

PATTERN.question=What does pattern recognition help us do?
PATTERN.answer=It helps us identify similarities and repeated ideas so we can solve problems more efficiently.

ALGORITHM.question=What is an algorithm?
ALGORITHM.answer=An algorithm is a clear, step-by-step set of instructions for solving a problem.

PYTHON.question=What is Python used for?
